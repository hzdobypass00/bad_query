name: Compilar IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Compilar sem assinatura
        run: |
          xcodebuild \
            -project bad_query.xcodeproj \
            -scheme bad_query \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r bad_query.ipa Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-ipa
          path: bad_query.ipa
